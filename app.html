<script>
/* =========================================================
   就爱读 · 92Reader
   数据全部存在浏览器 localStorage，无后端数据库
   ========================================================= */

const KEY = 'reader92.v1.state';
const LEGACY_KEYS = ['jad92.v1', 'readzy.v1'];
const DAY = 86400000;
const TARGET_DAYS = 337;      // 337/365 ≈ 92%
const ALLOWANCE   = 28;       // 每年休读额度

/* ---------- 状态 ---------- */
const DEFAULT_SETTINGS = {
  gran:'m', newPerDay:3, reviewCap:20, density:'m',
  rate:0.9, voice:true, theme:'light',
  proxy:'https://r.jina.ai/'
};

let state = load();
let ui = { tab:'today', roam:null, preview:null };

/* localStorage 按「源」隔离：换端口、换域名、换 file:// 路径都等于换一个空仓库。
   storeOK 记录当前环境能不能真正落盘，落不了时界面上要说清楚，不能假装存上了。 */
let storeOK = true, saveWarned = false;
function probeStore(){
  try{
    const k = KEY + '.probe';
    localStorage.setItem(k, '1'); localStorage.removeItem(k);
    return true;
  }catch(e){ return false; }
}
function load(){
  let raw = null;
  try{
    raw = localStorage.getItem(KEY);
    if(!raw){                       // 旧键迁移：早期用过 jad92.v1 / readzy.v1
      for(const k of LEGACY_KEYS){
        const old = localStorage.getItem(k);
        if(old){ raw = old; try{ localStorage.setItem(KEY, old); localStorage.removeItem(k); }catch(e){} break; }
      }
    }
  }catch(e){ return blank(); }
  if(!raw) return blank();
  try{
    const s = JSON.parse(raw);
    return {
      docs: s.docs || [],
      cards: s.cards || {},
      checkins: s.checkins || {},
      settings: Object.assign({}, DEFAULT_SETTINGS, s.settings || {})
    };
  }catch(e){ return blank(); }
}
function blank(){ return { docs:[], cards:{}, checkins:{}, settings:Object.assign({},DEFAULT_SETTINGS) }; }
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(state));
    storeOK = true;
  }catch(e){
    storeOK = false;
    if(!saveWarned){
      saveWarned = true;
      toast('当前环境无法保存数据，建议「设置 → 导出数据」备份');
    }
  }
}

/* 首次打开自动补样例：文库为空且从没填过，就灌 45 篇公有领域内容，
   避免任何一次「换了地址就看见空页面」。用户主动清空后不再自动灌。 */
function autoSeed(){
  if(state.docs.length || state.settings.seeded) return 0;
  let n = 0;
  for(const s of SAMPLES){
    if(state.docs.some(d=>d.title === s.t)) continue;
    addDoc({ title:s.t, author:s.a, genre:s.g, lang:s.l, text:s.c, source:'公有领域 · 内置样例' });
    n++;
  }
  state.settings.seeded = true;
  save();
  return n;
}

/* ---------- 工具 ---------- */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = ()=> fmt(new Date());
function fmt(d){
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
/* 只取日期部分：外部导入的数据可能带完整 ISO 时间戳，直接拼 'T00:00:00' 会得到 Invalid Date */
function dayNum(s){ return Math.floor(new Date(String(s).slice(0,10)+'T00:00:00').getTime()/DAY); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function uid(p){ return (p||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

let toastTimer=null;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.remove('hidden');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.add('hidden'), 2400);
}

/* ---------- 语言与长度 ---------- */
function detectLang(t){
  const cjk = (t.match(/[\u4e00-\u9fff\u3400-\u4dbf]/g)||[]).length;
  const latin = (t.match(/[A-Za-z]/g)||[]).length;
  return cjk > latin*0.3 ? 'zh' : 'en';
}
const GRAN = { zh:{s:15,m:50,l:150}, en:{s:10,m:30,l:80} };

/* ---------- 古诗文排版 ----------
   诗按句读断行才像诗，散文整段横排才对。先看体裁，再看句子长短：
   句句都短（古诗五七言、词、小古文）按句读断，出现长句就当散文不拆。 */
function isVerse(text, lang, genre){
  const g = String(genre||'');
  if(/诗|词|曲|赋|文言|古文|经|骈/.test(g)) return true;
  if(lang === 'en') return /poem|verse|poetry/i.test(g);   // 英文只认体裁，长文别乱拆
  const t = String(text||'').trim();
  if(!t) return false;
  // 按句末标点断句看长短：散文一句三十字上下，古诗一联也就十几个字
  const sent = t.split(/[。！？；]+/).map(s=>s.trim()).filter(Boolean);
  if(sent.length < 2) return false;
  const lens = sent.map(s=> s.replace(/[\s，。；！？、：,.!?;:]/g,'').length);
  return Math.max.apply(null, lens) <= 20;
}
function verseText(text, lang, genre){
  const t = String(text||'').trim();
  if(!isVerse(t, lang, genre)) return t;
  const re = lang==='en' ? /([,.;!?])\s*/g : /([，。；！？])\s*/g;
  const raw = t.replace(re, '$1\n').split('\n').map(s=>s.trim()).filter(Boolean);
  // 合并碎行：像「鹅，鹅，鹅」这种一两个字的短句要接回同一行，不然会被拆成三行
  const out = [];
  for(const ln of raw){
    const bare = ln.replace(/[\s，。；！？、：,.!?;:]/g,'').length;
    if(out.length && bare <= 2){
      out[out.length-1] += (lang==='en' ? ' ' : '') + ln;
    } else out.push(ln);
  }
  return out.join('\n');
}
const DISPLAY = (seg)=> verseText(seg.text, seg.doc.lang, seg.doc.genre);
function lenOf(s, lang){
  return lang==='en' ? s.trim().split(/\s+/).filter(Boolean).length : s.replace(/\s/g,'').length;
}

/* ---------- 分段：把任意文本切成记忆单元 ---------- */
function splitSentences(s, lang){
  if(lang==='en'){
    return s.split(/(?<=[.!?;])\s+/).map(x=>x.trim()).filter(Boolean);
  }
  const out=[]; let buf='';
  for(const ch of s){
    buf += ch;
    if('。！？；…'.includes(ch)){ out.push(buf.trim()); buf=''; }
  }
  if(buf.trim()) out.push(buf.trim());
  return out.filter(Boolean);
}
function pack(items, target, lang){
  const out=[]; let cur='';
  for(const it of items){
    const t = it.trim(); if(!t) continue;
    if(!cur){ cur=t; continue; }
    if(lenOf(cur,lang)+lenOf(t,lang) <= target*1.35){
      cur += (lang==='en' ? ' ' : '') + t;
    } else { out.push(cur); cur=t; }
  }
  if(cur) out.push(cur);
  return out;
}
function segmentDoc(text, lang, gran){
  const target = (GRAN[lang]||GRAN.zh)[gran||'m'];
  const raw = String(text||'').replace(/\r/g,'').trim();
  if(!raw) return [];
  const lines = raw.split('\n').map(x=>x.trim()).filter(Boolean);
  const avg = lines.reduce((a,b)=>a+b.length,0)/Math.max(1,lines.length);
  const verseLimit = lang==='en' ? 65 : 25;
  if(lines.length >= 2 && avg < verseLimit){
    return pack(lines.map(l=>l.replace(/\s+$/,'')), target, lang);
  }
  const blocks = raw.split(/\n\s*\n+/).map(x=>x.replace(/\n+/g,'').trim()).filter(Boolean);
  let items = [];
  if(blocks.length > 1){
    for(const b of blocks){
      if(lenOf(b,lang) > target*1.6) items.push(...splitSentences(b,lang));
      else items.push(b);
    }
  } else {
    items = splitSentences(raw, lang);
  }
  return pack(items, target, lang);
}

/* ---------- SM-2 间隔重复 ---------- */
function newCard(){
  return { ease:2.5, interval:1, reps:0, lastReview:null, status:'new', seen:0 };
}
function applyReview(card, q){
  if(q < 3){
    card.reps = 0; card.interval = 1;
  } else {
    if(card.reps === 0) card.interval = 1;
    else if(card.reps === 1) card.interval = 6;
    else card.interval = Math.round(card.interval * card.ease);
    card.reps++;
    card.ease = Math.max(1.3, card.ease + (0.1 - (5-q)*(0.08 + (5-q)*0.02)));
  }
  card.lastReview = today();
  card.status = (card.reps>=3 && card.interval>=21) ? 'mastered' : (card.reps>0 ? 'learning' : 'new');
  card.seen = (card.seen||0) + 1;
  return card;
}
function rateToQ(r){
  if(r >= 0.9) return 5;
  if(r >= 0.7) return 4;
  if(r >= 0.4) return 3;
  return 2;
}

/* ---------- 卡片索引 ---------- */
function allSegments(){
  const out = [];
  for(const d of state.docs){
    d.segments.forEach((text, i)=>{
      const id = d.id + '::' + i;
      out.push({ id, text, doc:d, idx:i });
    });
  }
  return out;
}
function cardOf(id){
  if(!state.cards[id]) state.cards[id] = newCard();
  return state.cards[id];
}
function todayQueue(){
  const segs = allSegments();
  const t = dayNum(today());
  const due = [], fresh = [];
  for(const s of segs){
    const c = cardOf(s.id);
    if(!c.lastReview){ fresh.push({ s, c }); continue; }
    const elapsed = t - dayNum(c.lastReview);
    if(elapsed >= c.interval){ due.push({ s, c, overdue: elapsed - c.interval }); }
  }
  due.sort((a,b)=> b.overdue - a.overdue);
  const cap = state.settings.reviewCap || 20;
  return {
    review: due.slice(0, cap),
    reviewTotal: due.length,
    fresh: fresh.slice(0, state.settings.newPerDay || 3),
    freshTotal: fresh.length
  };
}

/* ---------- 挖空 ---------- */
function makeCloze(text, lang, density, verse){
  let rate = density==='low' ? 0.2 : density==='high' ? 0.6 : 0.4;
  if(verse) rate = Math.min(rate, 0.35);   // 诗一行就五七个字，挖太多整行会碎掉
  return lang==='en' ? clozeEN(text, rate) : clozeZH(text, rate, verse ? 3 : 6);
}
/* 挖空宽度贴合答案字数：固定宽度在分行排版的诗里会把整行撑散 */
function gapStyle(tk, zh){
  const n = Array.from(tk.answer || '').length;
  const w = zh ? n * 1.02 : n * 0.6;
  return 'width:' + Math.max(zh ? 1.7 : 2.4, w).toFixed(2) + 'em';
}
function clozeZH(text, rate, maxSeg){
  const PUNCT = '，。！？；：、,.!?;:"“”‘’（）《》…—\n';
  const chars = Array.from(text);
  const runs = [];
  let i = 0;
  while(i < chars.length){
    if(!PUNCT.includes(chars[i])){
      let j = i;
      while(j < chars.length && !PUNCT.includes(chars[j])) j++;
      if(j - i >= 2) runs.push([i,j]);
      i = j;
    } else i++;
  }
  let budget = Math.floor(runs.reduce((a,[s,e])=>a+(e-s),0) * rate);
  const picked = [];
  for(const [s,e] of shuffle(runs.slice())){
    if(budget <= 0) break;
    const maxLen = Math.min(e-s, maxSeg || 6);
    if(maxLen < 2) continue;
    const len = 2 + Math.floor(Math.random()*Math.max(0, maxLen-1));
    const start = s + Math.floor(Math.random()*(e-s-len+1));
    if(picked.some(([ps,pe]) => !(pe <= start || ps >= start+len))) continue;
    picked.push([start, start+len]);
    budget -= len;
  }
  if(!picked.length) return [{ t:text }];
  picked.sort((a,b)=>a[0]-b[0]);
  const out = []; let pos = 0;
  for(const [s,e] of picked){
    if(pos < s) out.push({ t:text.slice(pos,s) });
    out.push({ blank:true, answer:text.slice(s,e), hint:Array.from(text.slice(s,s+1))[0] });
    pos = e;
  }
  if(pos < text.length) out.push({ t:text.slice(pos) });
  return out;
}
function clozeEN(text, rate){
  const parts = text.split(/(\s+)/);
  const cand = [];
  parts.forEach((w,i)=>{ if(/^[A-Za-z]/.test(w) && w.replace(/[^A-Za-z]/g,'').length > 2) cand.push(i); });
  const n = Math.max(1, Math.round(cand.length * rate));
  const set = new Set(shuffle(cand.slice()).slice(0,n));
  return parts.map((w,i)=> set.has(i)
    ? { blank:true, answer:w, hint:w[0] }
    : { t:w });
}

/* ---------- 漫游：遗忘曲线加权随机 ---------- */
function pickRoam(){
  const pool = allSegments().filter(s=> cardOf(s.id).lastReview);
  if(!pool.length) return null;
  const now = dayNum(today());
  const scored = pool.map(s=>{
    const c = cardOf(s.id);
    const days = Math.max(0, now - dayNum(c.lastReview));
    const urg = days / Math.max(1, c.interval);
    return { s, w: urg + (2.5 - c.ease)*0.5 + Math.random()*0.45 };
  });
  scored.sort((a,b)=>b.w - a.w);
  const top = scored.slice(0, Math.min(5, scored.length));
  return top[Math.floor(Math.random()*top.length)].s;
}

/* ---------- 统计 ---------- */
function stats(){
  const year = new Date().getFullYear();
  const prefix = year + '-';
  const done = Object.keys(state.checkins).filter(d=>d.startsWith(prefix)).length;
  const start = new Date(year,0,1).getTime();
  const elapsed = Math.floor((Date.now() - start)/DAY) + 1;
  const missed = Math.max(0, elapsed - done);
  const left = Math.max(0, ALLOWANCE - missed);
  const segs = allSegments();
  const cards = segs.map(s=>cardOf(s.id));
  return {
    year, done, elapsed, missed, left,
    rate: done/365,
    targetRate: TARGET_DAYS/365,
    total: segs.length,
    mastered: cards.filter(c=>c.status==='mastered').length,
    learning: cards.filter(c=>c.status==='learning').length,
    untouched: cards.filter(c=>c.status==='new').length,
    docs: state.docs.length
  };
}
function markCheckin(){
  const t = today();
  const rec = state.checkins[t] || { n:0 };
  rec.n++;
  state.checkins[t] = rec;
  save();
}

/* ---------- 语音 ---------- */
function speak(text, lang){
  if(!state.settings.voice || !('speechSynthesis' in window)) return;
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang==='en' ? 'en-US' : 'zh-CN';
    u.rate = state.settings.rate || 0.9;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function randLearned(){
  const pool = allSegments().filter(s=> cardOf(s.id).lastReview);
  return pool.length ? pool[Math.floor(Math.random()*pool.length)] : null;
}
function viewReview(){
  const q = todayQueue();
  // 当前题必须留住：核对后这段不再到期，重算队列会把它挤出首位，
  // 若直接取队列首位，评分结果刚算完就被冲掉，用户永远看不到正确率
  const cur = (ui.cloze && ui.cloze.seg) ? ui.cloze.seg : null;
  const seg = ui.forceSeg || cur || (q.review.length ? q.review[0].s : randLearned());
  ui.forceSeg = null;

  }

    const verse = isVerse(seg.text, seg.doc.lang, seg.doc.genre);
    ui.cloze = { seg:seg, verse:verse,
      tokens:makeCloze(DISPLAY(seg), seg.doc.lang, state.settings.density, verse),
      done:false, result:null };
  }
  const cz = ui.cloze;
  const zh = seg.doc.lang === 'zh';
  const body = cz.tokens.map((tk,i)=> tk.blank
    ? '<input class="gap'+(cz.done?' '+(tk._ok?'ok':'no'):'')+'" data-i="'+i+'" style="'+gapStyle(tk, zh)+'" '+
      (cz.done?'disabled value="'+esc(tk._val)+'"':'placeholder="'+esc(tk.hint)+'"')+'>'+
      (cz.done && !tk._ok ? '<span class="ans">'+esc(tk.answer)+'</span>' : '')
    : esc(tk.t)).join('');

  let h = '<div class="sec"><div class="card">'+
    '<div class="row" style="margin-bottom:10px"><span class="tag src">'+esc(seg.doc.title)+'</span>'+
    '<span class="tiny dim grow">'+(q.review.length?q.review.length+' 项待复习':'自由练习')+'</span></div>'+
    '<div class="cloze'+(zh?' zh':'')+(cz.verse?' verse':'')+'" id="clozeBox">'+body+'</div>';

  if(cz.done){
    const r = cz.result;
    h += '<div class="hr"></div><div class="row between small">'+
      '<span>正确率 <b>'+Math.round(r.rate*100)+'%</b> · '+r.ok+'/'+r.total+' 空</span>'+
      '<span class="dim">下次复习：'+r.next+'</span></div>'+
      '<div class="tiny dim" style="margin-top:6px">'+r.note+'</div>';
    h += '<div class="row" style="margin-top:12px;gap:8px"><button class="btn pri grow" data-act="nextCloze">下一题</button>'+
      '<button class="btn" data-act="clozeSpeak">朗读原文</button></div>';
  } else {
    h += '<div class="row" style="margin-top:14px;gap:8px">'+
      '<button class="btn pri grow" data-act="checkCloze">核对</button>'+
      '<button class="btn" data-act="clozeGiveUp">想不起来</button>'+
      '<button class="btn" data-act="clozeSpeak">朗读</button></div>'+
      '<div class="tiny dim" style="margin-top:8px">先凭记忆填，填完再核对。只填空格，不用默写整段。</div>';
  }
  h += '</div></div>';
  return h;
}
function norm(s){
  let t = String(s==null?'':s);
  t = t.replace(/[\uFF01-\uFF5E]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  t = t.replace(/[\u3000\s]/g,'');
  t = t.replace(/[，。！？；：、,.!?;:"'“”‘’（）《》…—-]/g,'');
  return t.toLowerCase();
}
function doCheckCloze(){
  const cz = ui.cloze; if(!cz || cz.done) return;
  const inputs = $$('#clozeBox .gap');
  if(!inputs.length){ toast('这道题没有挖空'); return; }
  let ok = 0;
  inputs.forEach(inp=>{
    const tk = cz.tokens[+inp.dataset.i];
    const val = inp.value;
    const good = norm(val) === norm(tk.answer);
    tk._ok = good; tk._val = val;
    if(good) ok++;
  });
  const rate = ok / inputs.length;
  const q = rateToQ(rate);
  const c = cardOf(cz.seg.id);
  applyReview(c, q);
  save(); markCheckin();
  const next = new Date(Date.now() + c.interval*DAY);
  cz.done = true;
  cz.result = { ok, total:inputs.length, rate, next:fmt(next),
    note: q>=5 ? '很熟了，下次间隔拉长到 '+c.interval+' 天'
        : q>=4 ? '记得不错，'+c.interval+' 天后再来'
        : q>=3 ? '有点生疏，'+c.interval+' 天后重逢'
        : '明天就再来一遍' };
  render();
}
function doGiveUp(){
  const cz = ui.cloze; if(!cz || cz.done) return;
  const inputs = $$('#clozeBox .gap');
  inputs.forEach(inp=>{ const tk = cz.tokens[+inp.dataset.i]; tk._ok = false; tk._val = ''; });
  const c = cardOf(cz.seg.id);
  applyReview(c, 0);
  save(); markCheckin();
  cz.done = true;
  cz.result = { ok:0, total:inputs.length, rate:0, next:fmt(new Date(Date.now()+DAY)), note:'明天就再来一遍' };
  render();
}

function heatCells(){
  const out = [];
  const end = new Date(); end.setHours(0,0,0,0);
  const start = new Date(end);
  start.setDate(start.getDate() - (7*11 + end.getDay()));
  for(const dt = new Date(start); dt <= end; dt.setDate(dt.getDate()+1)){
    const key = fmt(dt);
    const rec = state.checkins[key];
    out.push({ key, n: rec ? rec.n : 0 });
  }
  return out;
}

function findSeg(id){

  const i = parseInt(p[1], 10);
  if(!(i >= 0) || !d.segments[i]) return null;
  return { id, text:d.segments[i], doc:d, idx:i };
}

function delSeg(id){
  const seg = findSeg(id); if(!seg) return;
  if(!confirm('删除这一段？它的记忆记录也会一起删掉。')) return;
  const d = seg.doc, n = d.segments.length, i = seg.idx;
  d.segments.splice(i,1);
  for(let k=i+1;k<n;k++) state.cards[d.id+'::'+(k-1)] = state.cards[d.id+'::'+k];
  delete state.cards[d.id+'::'+(n-1)];
  if(!d.segments.length){            // 最后一段删掉就整篇没了
    state.docs = state.docs.filter(x=>x.id!==d.id);
    save(); closeModal(); render(); toast('已删除');
    return;
  }
  save(); render(); openDoc(d.id); toast('已删除这一段');
}
function addSeg(id){
  const d = state.docs.find(x=>x.id===id); if(!d) return;
  showModal('补一段',

    '<div class="row" style="gap:8px;margin-top:12px"><button class="btn grow" data-act="closeModal">取消</button>'+

  const d = state.docs.find(x=>x.id===id); if(!d) return;
  const t = ($('#segText').value || '').trim();
  if(!t){ toast('内容不能为空'); return; }
  d.segments.push(t);
  cardOf(d.id+'::'+(d.segments.length-1));
  save(); closeModal(); render(); openDoc(d.id);
  toast('已补上这一段');
}
/** 按当前粒度重切整篇：内容没变的段继承原有记忆进度 */
function resegDoc(id){
  const d = state.docs.find(x=>x.id===id); if(!d) return;
  const old = d.segments.slice();
  // 逐段重切：段边界不动，只在段内按当前粒度调整。
  // 若整篇一起喂给 segmentDoc，短文本会被诗歌分支打包，手动补的段会被吞回一大段。
  const segs = [];
  for(const s of old){
    const parts = segmentDoc(s, d.lang, state.settings.gran);
    segs.push(...(parts.length ? parts : [s]));
  }
  if(!segs.length){ toast('切不出内容'); return; }
  const used = {}, next = {};
  old.forEach((_,i)=> used[i] = false);
  segs.forEach((t,i)=>{
    const j = old.findIndex((o,k)=> !used[k] && o === t);
    if(j >= 0){ used[j] = true; next[d.id+'::'+i] = state.cards[d.id+'::'+j]; }
  });
  old.forEach((_,i)=> delete state.cards[d.id+'::'+i]);
  Object.assign(state.cards, next);
  d.segments = segs;
  save(); render(); openDoc(d.id);
  toast('已重切成 '+segs.length+' 段');
}

function readFile(f){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=> res(String(r.result));
    r.onerror = ()=> rej(new Error('读取失败'));
    r.readAsText(f, 'utf-8');
  });
}

/* ---------- 浏览器内网页正文提取（不需要服务端） ----------
   CORS 决定了前端无法直接抓任意网页，但「网页源码」到了本地就能解析：
   粘贴源码或拖入 .html 文件，用 DOMParser 提取正文，清洗逻辑与服务端一致。 */
const NOISE_RE =
  /(登录|注册|登录后可|版权所有|Copyright|免责声明|相关阅读|推荐阅读|延伸阅读|Read more|Subscribe|Sign in|Sign up|Cookie|Advertisement|点击查看|扫一扫|长按|关注我们)/i;

function looksLikeHtml(t){
  return /<[a-z]+[\s>]/i.test(t) && /<\/(html|body|p|div|article|section|h[1-6])>/i.test(t);
}
function extractFromHtml(html){
  let doc;
  try{ doc = new DOMParser().parseFromString(html, 'text/html'); }
  catch(e){ return null; }
  const tEl = doc.querySelector('title'), hEl = doc.querySelector('h1');
  const title = ((tEl && tEl.textContent) || (hEl && hEl.textContent) || '').replace(/\s+/g,' ').trim();

  $$('script,style,noscript,svg,iframe,nav,footer,header,aside,form,button', doc)
    .forEach(n=> n.remove());

  let root = doc.querySelector('article') || doc.querySelector('main');
  const solid = el => (el && el.textContent ? el.textContent.replace(/\s/g,'').length : 0);
  if(solid(root) < 120){
    let best = null, bestScore = -1;
    $$('div', doc).forEach(d=>{
      const raw = d.textContent || '';
      if(raw.replace(/\s/g,'').length < 120) return;
      const linkLen = $$('a', d).reduce((a,x)=> a + (x.textContent||'').length, 0);
      const score = raw.length + d.querySelectorAll('p').length * 80 - linkLen * 0.6;
      if(score > bestScore){ bestScore = score; best = d; }
    });
    root = best || doc.body;
  }
  if(!root) return null;

  /* 压缩过的网页把正文和页脚挤在同一行，没有换行就无法按行去噪，也会毁掉分段。
     所以在块级元素之间补换行（在副本上操作，不碰原文档）。 */
  const work = root.cloneNode(true);
  $$('p,div,li,h1,h2,h3,h4,h5,h6,blockquote,pre,tr,td,br', work)
    .forEach(el=>{ try{ el.insertAdjacentText('afterend','\n'); }catch(e){} });

  const rawLines = (work.textContent || '').split('\n')
    .map(l=> l.replace(/[\t\u00a0 ]+/g,' ').trim()).filter(Boolean);
  const keep = rawLines.filter(l=>
    l.length >= 2 && !/^https?:\/\/\S+$/.test(l) && !(NOISE_RE.test(l) && l.length < 40));
  // 去噪过头时退回原文：宁可留一点噪音，也不要把正文整段丢掉
  const lines = keep.join('').length >= rawLines.join('').length * 0.4 ? keep : rawLines;
  const text = lines.join('\n');
  if(text.replace(/\s/g,'').length < 20) return null;
  return { title: title.slice(0,60), text, lang: detectLang(text) };
}

/** 清洗公共代理返回的 markdown（去元数据头、图片、链接标记） */
function cleanProxyText(raw){
  const lines = String(raw).split('\n');
  const out = [];
  let title = '', inMeta = true;
  for(const l of lines){
    const t = l.trim();
    if(inMeta){
      const m = /^Title:\s*(.+)$/i.exec(t);
      if(m){ title = m[1].trim(); continue; }
      if(/^(URL Source|Published Time|Markdown Content):/i.test(t)) continue;
      if(t === '') continue;
      inMeta = false;
    }
    out.push(t);
  }
  const text = out.join('\n')
    .replace(/!\[[^\]]*\]\([^)]*\)/g, '')          // 图片
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')       // 链接只留文字
    .replace(/^\s*#{1,6}\s+/gm, '')                // 标题符号
    .replace(/\*\*|__/g, '')                       // 粗体标记
    .split('\n').map(x=> x.trim())
    .filter(x=> x && !/^\|?[\s:\-|]+\|$/.test(x))  // 表格分隔行
    .map(x=> /^\|.*\|$/.test(x)                    // 表格行拍平成一行文字
      ? x.replace(/^\||\|$/g,'').replace(/\|/g,' ').replace(/\s+/g,' ').trim() : x)
    .filter(Boolean).join('\n');
  return { title, text };
}

function handleIncoming(text, name){
  const parsed = tryReadzy(text);
  if(parsed){
    const n = importReadzy(parsed);
    if(n > 0){ closeModal(); render(); }
    return;
  }
  if(looksLikeHtml(text)){
    const ex = extractFromHtml(text);
    if(ex){
      ui.preview = { title: ex.title || (name||'').replace(/\.(html?|txt|md|json)$/i,'') || '未命名',
                     text: ex.text, lang: ex.lang, genre:'', source:'' };
      renderPreview();
      toast('已从网页源码提取正文');
      return;
    }
    toast('未能从源码中提取正文，按纯文本处理');
  }
  ui.preview = { title:(name||'').replace(/\.(txt|md|json)$/i,'') || '未命名', text:text, lang:detectLang(text), genre:'', source:'' };
  renderPreview();
}
function tryReadzy(t){
  try{
    const o = JSON.parse(t);
    if(Array.isArray(o) || (o && (Array.isArray(o.docs) || o.title))) return o;
  }catch(e){}
  return null;
}
function importReadzy(o){
  let arr = [];
  if(Array.isArray(o)) arr = o;
  else if(o && Array.isArray(o.docs)) arr = o.docs;
  else if(o && o.title) arr = [o];
  let n = 0;
  for(const d of arr){
    if(!d || (!d.title && !d.content && !d.segments)) continue;
    if(d.title && state.docs.some(x=>x.title === d.title)) continue;
    addDoc({ title:d.title||'未命名', author:d.author, genre:d.genre, lang:d.lang,
             text:d.content||'', segments:d.segments, source:d.source, tags:d.tags });
    n++;
  }
  toast(n ? '已导入 '+n+' 篇' : '没有新增内容（可能已存在）');
  return n;
}
function renderPreview(){
  const p = ui.preview; if(!p) return;
  const segs = segmentDoc(p.text, p.lang, state.settings.gran);
  $('#impPreview').innerHTML = '<hr class="hr">'+
    '<label class="lab">标题</label><input class="fld" id="pvTitle" value="'+esc(p.title)+'">'+
    '<div class="grid2" style="margin-top:10px"><div><label class="lab">语言</label>'+
    '<select class="fld" id="pvLang"><option value="zh"'+(p.lang==='zh'?' selected':'')+'>中文</option>'+
    '<option value="en"'+(p.lang==='en'?' selected':'')+'>英文</option></select></div>'+
    '<div><label class="lab">体裁</label><input class="fld" id="pvGenre" value="'+esc(p.genre||'未分类')+'"></div></div>'+
    '<label class="lab" style="margin-top:12px">分段粒度</label>'+
    '<div class="seg" id="pvGran"><button data-g="s" class="'+(state.settings.gran==='s'?'on':'')+'">短</button>'+
    '<button data-g="m" class="'+(state.settings.gran==='m'?'on':'')+'">中</button>'+
    '<button data-g="l" class="'+(state.settings.gran==='l'?'on':'')+'">长</button></div>'+
    '<div class="small dim" style="margin:10px 0 6px">切成 '+segs.length+' 个记忆单元</div>'+
    '<div>'+segs.slice(0,6).map(s=>'<div class="pv">'+esc(verseText(s, p.lang, p.genre))+'</div>').join('')+
    (segs.length>6 ? '<div class="tiny dim" style="margin-top:6px">… 其余 '+(segs.length-6)+' 段</div>' : '')+'</div>'+
    '<button class="btn pri block" data-act="confirmImport" style="margin-top:14px">导入 '+segs.length+' 个单元</button>';
}
function addDoc(o){
  const lang = o.lang || detectLang(o.text||'');
  let segs = (o.segments && o.segments.length) ? o.segments : segmentDoc(o.text||'', lang, state.settings.gran);
  segs = segs.map(s=>String(s).trim()).filter(Boolean);
  if(!segs.length) return null;
  const doc = { id:uid('doc'), title:o.title||'未命名', genre:o.genre||'未分类', lang,
    author:o.author||'', source:o.source||'', tags:o.tags||[],
    createdAt:new Date().toISOString(), segments:segs };
  state.docs.push(doc);
  segs.forEach((_,i)=> cardOf(doc.id+'::'+i));
  save();
  return doc;
}
function importSamples(){
  let n = 0;
  for(const s of SAMPLES){
    if(state.docs.some(d=>d.title === s.t)) continue;
    addDoc({ title:s.t, author:s.a, genre:s.g, lang:s.l, text:s.c, source:'公有领域 · 内置样例' });
    n++;
  }
  save(); closeModal();
  toast(n ? ('已载入 '+n+' 篇样例') : '样例库已在文库中');
  render();
}

function download(text, name, type){
  const blob = new Blob([text], { type: type||'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportData(){
  const payload = { format:'readzy.v1', exportedAt:new Date().toISOString(),
    docs: state.docs.map(d=>({
      id:d.id, title:d.title, genre:d.genre, lang:d.lang, author:d.author,
      source:d.source, tags:d.tags, createdAt:d.createdAt,
      content:d.segments.join('\n'),
      progress:d.segments.map((_,i)=>{
        const c = state.cards[d.id+'::'+i] || newCard();
        return { i, ease:+c.ease.toFixed(2), interval:c.interval, reps:c.reps,
                 lastReview:c.lastReview, status:c.status };
      })
    }))
  };
  download(JSON.stringify(payload, null, 2), '92reader-'+today()+'.json', 'application/json');
  toast('已导出');
}

/* ---------- 分享图 ---------- */
function shareCard(){
  const s = stats();
  const W = 750, H = 1080;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const dark = state.settings.theme === 'dark';
  const bg = dark ? '#0d0d11' : '#fbfbfc';
  const ink = dark ? '#e9e9ef' : '#16161d';
  const ink2 = dark ? '#a0a0ad' : '#5c5c68';
  const ink3 = dark ? '#6f6f80' : '#92929c';
  const line = dark ? '#26262f' : '#e7e7ec';
  const accent = '#5e6ad2';

  g.fillStyle = bg; g.fillRect(0,0,W,H);
  g.fillStyle = accent; g.fillRect(0,0,W,6);

  g.fillStyle = ink;
  g.font = '600 34px -apple-system,"PingFang SC",sans-serif';
  g.fillText('就爱读', 56, 92);
  g.fillStyle = ink3;
  g.font = '400 18px -apple-system,sans-serif';
  g.fillText('92READER', 152, 92);

  g.fillStyle = ink2;
  g.font = '400 20px -apple-system,"PingFang SC",sans-serif';
  g.fillText(s.year + ' 年阅读记录', 56, 148);

  // 大数字
  g.fillStyle = ink;
  g.font = '650 132px -apple-system,"PingFang SC",sans-serif';
  g.fillText(String(s.done), 56, 300);
  const wNum = g.measureText(String(s.done)).width;
  g.fillStyle = ink3;
  g.font = '400 30px -apple-system,"PingFang SC",sans-serif';
  g.fillText('天', 56 + wNum + 12, 300);

  g.fillStyle = ink2;
  g.font = '400 22px -apple-system,"PingFang SC",sans-serif';
  g.fillText('今年已读 ' + s.done + ' 天 · 完成率 ' + Math.round(s.rate*100) + '%', 56, 350);

  // 进度条
  const bx = 56, by = 396, bw = W - 112, bh = 18;
  g.fillStyle = line; roundRect(g, bx, by, bw, bh, 9); g.fill();
  g.fillStyle = accent; roundRect(g, bx, by, Math.max(6, bw * Math.min(1, s.rate)), bh, 9); g.fill();
  g.fillStyle = '#b8791a';
  g.fillRect(bx + bw*0.923 - 1, by - 8, 3, bh + 16);
  g.font = '400 17px -apple-system,sans-serif';
  g.fillText('92%  ·  337 天', bx + bw*0.923 - 30, by + 56);

  g.fillStyle = ink3;
  g.font = '400 18px -apple-system,"PingFang SC",sans-serif';
  g.fillText('还差 ' + Math.max(0, TARGET_DAYS - s.done) + ' 天达标 · 休读额度剩 ' + s.left + ' 天', 56, by + 104);

  // 数据块
  const rows = [['已掌握', s.mastered + ' 个'], ['学习中', s.learning + ' 个'], ['文库', s.docs + ' 篇']];
  rows.forEach((r, i)=>{
    const y = 620 + i*72;
    g.fillStyle = line; g.fillRect(56, y - 26, W - 112, 1);
    g.fillStyle = ink2; g.font = '400 22px -apple-system,"PingFang SC",sans-serif';
    g.fillText(r[0], 56, y);
    g.fillStyle = ink; g.font = '600 24px -apple-system,"PingFang SC",sans-serif';
    const tw = g.measureText(r[1]).width;
    g.fillText(r[1], W - 56 - tw, y);
  });

  // 热力图（最近 12 周）
  const cells = heatCells().slice(-84);
  const cw = 13, chh = 13, gap = 5;
  const hx = 56, hy = 812;
  cells.forEach((c2, i)=>{
    const col = Math.floor(i/7), row = i%7;
    const x = hx + col*(cw+gap), y = hy + row*(chh+gap);
    g.fillStyle = c2.n ? (c2.n > 4 ? accent : c2.n > 1 ? '#9aa5ee' : '#cdd3f7') : line;
    roundRect(g, x, y, cw, chh, 3); g.fill();
  });

  // slogan
  g.fillStyle = ink3;
  g.font = '400 19px -apple-system,"PingFang SC",sans-serif';
  g.fillText('337 / 365 ≈ 92%', 56, 1032);
  g.fillStyle = ink2;
  g.font = '400 17px -apple-system,"PingFang SC",sans-serif';
  g.fillText('一年里九成的日子，就爱读', 56, 1062);

  c.toBlob(blob=>{
    if(!blob){ toast('生成失败'); return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '92reader-' + today() + '.png';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 800);
    toast('分享图已保存');
  }, 'image/png');
}
function roundRect(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x+r, y);
  g.arcTo(x+w, y, x+w, y+h, r);
  g.arcTo(x+w, y+h, x, y+h, r);
  g.arcTo(x, y+h, x, y, r);
  g.arcTo(x, y, x+w, y, r);
  g.closePath();
}

document.addEventListener('click', e=>{
  const tabBtn = e.target.closest('[data-tab]');

  if(impTab){ renderImpBody(impTab.dataset.imp); return; }

  const densBtn = e.target.closest('[data-d]');
  if(densBtn){ state.settings.density = densBtn.dataset.d; save(); openSettings(); return; }

  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;

  switch(act){
    case 'settings': openSettings(); break;

    case 'import': openImport(); break;
    case 'importSamples': importSamples(); break;
    case 'read': openRead(id); break;
    case 'readSpeak': { const seg = findSeg(ui.read.id); if(seg) speak(seg.text, seg.doc.lang); break; }
    case 'readStop': try{ window.speechSynthesis.cancel(); }catch(err){} break;
    case 'readDone': finishRead(); break;
    case 'cloze': { const sg = findSeg(id); ui.forceSeg = sg; ui.tab='review'; ui.cloze=null; render(); break; }
    case 'checkCloze': doCheckCloze(); break;
    case 'clozeGiveUp': doGiveUp(); break;
    case 'clozeSpeak': { const seg = ui.cloze && ui.cloze.seg; if(seg) speak(seg.text, seg.doc.lang); break; }
    case 'nextCloze': ui.cloze = null; render(); break;
    case 'roamNext': ui.roam = pickRoam(); render(); break;
    case 'roamSpeak': if(ui.roam) speak(ui.roam.text, ui.roam.doc.lang); break;
    case 'roamRate': {
      if(!ui.roam) break;
      const c = cardOf(ui.roam.id);
      applyReview(c, parseInt(el.dataset.q,10));
      save(); markCheckin();
      ui.roam = pickRoam(); render();
      toast('已记录，' + c.interval + ' 天后再见');
      break;
    }
    case 'docView': openDoc(id); break;
    case 'editSeg': openEditSeg(id); break;
    case 'saveSeg': saveSeg(id); break;
    case 'delSeg': delSeg(id); break;
    case 'addSeg': addSeg(id); break;
    case 'saveNewSeg': saveNewSeg(id); break;
    case 'resegDoc': resegDoc(id); break;
    case 'delDoc': {
      const d = state.docs.find(x=>x.id===id);
      if(!d) break;
      d.segments.forEach((_,i)=> delete state.cards[d.id+'::'+i]);
      state.docs = state.docs.filter(x=>x.id!==id);
      save(); closeModal(); render(); toast('已删除');
      break;
    }
    case 'fetchUrl': doFetch(); break;
    case 'pastePreview': {
      const t = $('#impText').value.trim();
      if(!t){ toast('请粘贴内容'); break; }
      const ex = looksLikeHtml(t) ? extractFromHtml(t) : null;
      if(ex){
        ui.preview = { title:$('#impTitle').value.trim() || ex.title || '未命名', text:ex.text,
          lang:ex.lang, genre:$('#impGenre').value.trim(), source:'' };
        renderPreview(); toast('已从网页源码提取正文');
        break;
      }
      ui.preview = { title:$('#impTitle').value.trim() || '未命名', text:t,
        lang:detectLang(t), genre:$('#impGenre').value.trim(), source:'' };
      renderPreview();
      break;
    }
    case 'confirmImport': {
      const p = ui.preview; if(!p) break;
      const doc = addDoc({ title:$('#pvTitle').value.trim()||p.title, text:p.text,
        lang:$('#pvLang').value, genre:$('#pvGenre').value.trim(), source:p.source });
      if(!doc){ toast('没有可导入的内容'); break; }
      ui.preview = null; closeModal(); render();
      toast('已导入「'+doc.title+'」，共 '+doc.segments.length+' 个单元');
      break;
    }
    case 'export': exportData(); break;
    case 'pickImportFile': {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = '.json,application/json';
      inp.onchange = async ()=>{
        const f = inp.files[0]; if(!f) return;
        try{
          if(importReadzy(JSON.parse(await readFile(f))) > 0){ closeModal(); render(); }
        }catch(err){ toast('文件不是合法的 JSON'); }
      };
      inp.click();
      break;
    }
    case 'share': shareCard(); break;
    case 'saveSettings': saveSettings(); break;
    case 'wipe': {
      if(!confirm('确定清空全部数据？此操作不可撤销，建议先导出备份。')) break;
      state = blank();
      state.settings.seeded = true;   // 主动清空后不再自动补样例
      save(); closeModal();
      document.documentElement.setAttribute('data-theme','light');
      render(); toast('已清空');
      break;
    }
  }
});

$('#modal').addEventListener('click', e=>{ if(e.target.id === 'modal') closeModal(); });

/* 文档详情里改标题 / 体裁：失焦或回车即存 */
$('#modal').addEventListener('change', e=>{
  const t = e.target;
  if(t.id !== 'docTitle' && t.id !== 'docGenre') return;
  const d = state.docs.find(x=> x.id === t.dataset.doc);
  if(!d) return;
  const v = t.value.trim();
  if(t.id === 'docTitle') d.title = v || d.title;
  else d.genre = v || '未分类';
  save(); render(); toast('已保存');
});

function fetchWithTimeout(url, ms){
  const ctrl = new AbortController();
  const timer = setTimeout(()=> ctrl.abort(), ms);
  return fetch(url, { signal: ctrl.signal }).finally(()=> clearTimeout(timer));
}

/* 抓取三级：公共代理（纯前端主路径） → 自建服务端（整站部署时） → 提示降级 */
async function doFetch(){
  const url = ($('#impUrl').value || '').trim();
  if(!url){ toast('请填写链接'); return; }
  let pu;
  try{ pu = new URL(url); }catch(e){ toast('链接格式不正确'); return; }
  if(!/^https?:$/.test(pu.protocol)){ toast('仅支持 http / https 链接'); return; }

  const btn = $('[data-act="fetchUrl"]');
  if(btn){ btn.disabled = true; btn.textContent = '抓取中…'; }
  let got = null;
  try{
    const proxy = (state.settings.proxy || '').trim();
    if(proxy){
      try{
        const r = await fetchWithTimeout(proxy.replace(/\/$/,'') + '/' + url, 30000);
        if(r.ok){
          const c = cleanProxyText(await r.text());
          if(c.text.replace(/\s/g,'').length >= 20) got = { title:c.title || pu.hostname, text:c.text };
        }
      }catch(e){}
    }
    if(!got){
      try{
        const r = await fetchWithTimeout('/api/fetch?url=' + encodeURIComponent(url), 20000);
        const j = await r.json();
        if(j && j.ok) got = { title:j.title || url, text:j.text };
      }catch(e){}
    }
    if(!got){
      toast('链接抓取失败：把网页另存为 .html 走「文件」导入，或复制源码粘到「粘贴」页');
      return;
    }
    const parsed = tryReadzy(got.text);
    if(parsed){
      const n = importReadzy(parsed);
      if(n > 0){ closeModal(); render(); }
      return;
    }
    ui.preview = { title:got.title || url, text:got.text, lang:detectLang(got.text),
                   genre:'', source:url };
    renderPreview();
  }catch(err){
    toast('抓取出错，可改用网页源码 / 文件 / 样例库导入');
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = '抓取'; }
  }
}

/* =========================================================
   启动
   ========================================================= */
document.documentElement.setAttribute('data-theme', state.settings.theme || 'light');
storeOK = probeStore();
const seeded = autoSeed();
render();
if(!storeOK) toast('当前环境无法本地保存，刷新后数据会丢失');
else if(seeded) toast('已载入 '+seeded+' 篇公有领域样例，可直接开始');
</script>
